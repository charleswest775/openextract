name: Flatpak

# Builds and lints the Flathub package in packaging/flathub with the same
# tools Flathub's own build bot uses, so it can be checked without a Linux
# machine. Nothing is published: the built bundle is only kept as a workflow
# artifact for a few days.

on:
  pull_request:
    paths:
      - 'packaging/flathub/**'
      - '.github/workflows/flatpak.yml'
  push:
    branches: [main]
    paths:
      - 'packaging/flathub/**'
      - '.github/workflows/flatpak.yml'
  workflow_dispatch:

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    env:
      MANIFEST: packaging/flathub/app.openextract.OpenExtract.yml
      METAINFO: packaging/flathub/app.openextract.OpenExtract.metainfo.xml
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Flathub's builder and linter
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder

      - name: Lint the manifest
        run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest "$MANIFEST"

      - name: Lint the store text (metainfo)
        run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder appstream "$METAINFO"

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: ${{ env.MANIFEST }}
          bundle: openextract.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true

      - name: Lint the built repo
        run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo
