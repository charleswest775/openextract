name: Intel Mac engine
description: >
  Builds the engine for Intel Macs into python/dist/x64 on an Apple Silicon runner, with an
  x64 Python that runs under Rosetta. PyInstaller builds for the chip of the Python running
  it, and pip picks x86_64 wheels for an x64 Python. Run it after ios-backup-core is cloned
  next to the checkout. It leaves PATH alone, so the job's own (arm64) Python stays the one
  every other step uses.

runs:
  using: composite
  steps:
    - name: Setup Python (x64)
      id: python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        architecture: x64
        update-environment: false

    - name: Install the engine's dependencies and PyInstaller (x64)
      shell: bash
      working-directory: python
      env:
        PY: ${{ steps.python.outputs.python-path }}
      run: |
        machine=$("$PY" -c 'import platform; print(platform.machine())')
        echo "$PY is a $machine Python"
        if [ "$machine" != x86_64 ]; then
          echo "::error::Expected an x86_64 Python for the Intel engine, got $machine"
          exit 1
        fi
        "$PY" -m pip install pyinstaller -r requirements.txt

    - name: Build the engine (x64)
      shell: bash
      env:
        PY: ${{ steps.python.outputs.python-path }}
      run: node scripts/bundle-engine.mjs --python "$PY"
