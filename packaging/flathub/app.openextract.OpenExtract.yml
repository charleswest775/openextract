# Flathub manifest draft for OpenExtract. Repackages the upstream .deb that
# the project's own release CI builds; see README.md for what to check first.
app-id: app.openextract.OpenExtract
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: openextract
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  # iPhone backups live in ~/MobileSync/Backup by default (python/backup.py),
  # the engine keeps a size cache in ~/.openextract, and exports are written
  # wherever the user picks. Read-write home is the simplest honest grant.
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  # No --share=network on purpose: nothing the app does needs the internet,
  # and in a Flatpak updates come from Flathub, not the in-app updater.
modules:
  - name: openextract
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/charleswest775/openextract/releases/download/v0.8.1/openextract_0.8.1_amd64.deb
        sha256: 72ffe0cca53ee3b389d9cf9f42def0399dacac40474f37be0c60a328d9ad3d5c
        dest-filename: openextract.deb
        only-arches:
          - x86_64
      - type: file
        path: app.openextract.OpenExtract.desktop
      - type: file
        path: app.openextract.OpenExtract.metainfo.xml
      - type: file
        path: app.openextract.OpenExtract.svg
      - type: script
        dest-filename: openextract.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper /app/OpenExtract/openextract "$@"
    build-commands:
      - ar x openextract.deb
      - tar -xf data.tar.xz
      - mv opt/OpenExtract /app/OpenExtract
      # The Flatpak sandbox replaces Chromium's setuid helper.
      - rm -f /app/OpenExtract/chrome-sandbox
      - install -Dm755 openextract.sh /app/bin/openextract
      # Install OpenExtract's own mark as a scalable icon (the same as
      # website/static/img/logo.svg) rather than the .deb's PNGs.
      - install -Dm644 app.openextract.OpenExtract.svg /app/share/icons/hicolor/scalable/apps/app.openextract.OpenExtract.svg
      - install -Dm644 app.openextract.OpenExtract.desktop /app/share/applications/app.openextract.OpenExtract.desktop
      - install -Dm644 app.openextract.OpenExtract.metainfo.xml /app/share/metainfo/app.openextract.OpenExtract.metainfo.xml
