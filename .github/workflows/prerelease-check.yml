name: Pre-release check

# release.yml runs this on the new tag, alongside the signed builds, and publishes only if it
# passes. Run it by hand from the Actions tab to check main or a branch at any time.
#
# On Linux, macOS and Windows it builds the engine and the app the way release.yml does,
# but unsigned and unpublished, then
#   - runs the backup corpus (public items plus every generated one) against the engine
#     inside the packaged app, and
#   - drives the packaged app through every end-to-end suite in scripts/e2e (docs/TESTING.md).
#
# Third-party backups (Hickman, FCSC) may not be screenshotted or redistributed, so the
# only artifacts uploaded are the e2e results for the fictional maren backups.
# Linux here builds on the runner's own OS; release.yml builds Linux in an older distro.

on:
  workflow_dispatch:
    inputs:
      ios_backup_core_ref:
        description: 'ios-backup-core branch or tag to build against'
        required: false
        default: 'master'
      items:
        description: 'Public corpus items to fetch and test (comma-separated)'
        required: false
        default: 'pub-hickman-13.3.1,pub-hickman-13.4.1,pub-hickman-15.3.1,pub-hickman-16.1.2,pub-hickman-17.3,pub-fcsc25-16.0'
  # From release.yml. The defaults match workflow_dispatch's above; keep them in step.
  workflow_call:
    inputs:
      ref:
        description: 'Tag to check out and test (release.yml passes the new release tag)'
        type: string
        default: ''
      ios_backup_core_ref:
        type: string
        default: 'master'
      items:
        type: string
        default: 'pub-hickman-13.3.1,pub-hickman-13.4.1,pub-hickman-15.3.1,pub-hickman-16.1.2,pub-hickman-17.3,pub-fcsc25-16.0'

permissions:
  contents: read

jobs:
  packaged:
    name: packaged app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            app: linux-unpacked/openextract
            engine: linux-unpacked/resources/python/openextract-engine
          - os: macos-latest
            app: mac-arm64/OpenExtract.app/Contents/MacOS/OpenExtract
            engine: mac-arm64/OpenExtract.app/Contents/Resources/python/openextract-engine
          - os: windows-latest
            app: win-unpacked/OpenExtract.exe
            engine: win-unpacked/resources/python/openextract-engine.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Inside the checkout, so the public backups' cache below has the same path on every
      # system. Every corpus command (fetch, the tests, scripts/e2e/backups.py) reads it.
      OPENEXTRACT_CORPUS_CACHE: ${{ github.workspace }}/.corpus-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      # Same sibling layout as ci.yml: python/requirements.txt installs
      # ios-backup-core from ../../ios-backup-core.
      - name: Clone ios-backup-core (sibling for editable install)
        env:
          REF: ${{ inputs.ios_backup_core_ref || 'master' }}
        run: |
          git clone --depth=1 --branch "$REF" \
            https://github.com/charleswest775/ios-backup-core.git \
            "$GITHUB_WORKSPACE/../ios-backup-core"

      - name: Cache the generated backups' photos
        uses: ./.github/actions/backupgen-media

      - name: Install Python dependencies and PyInstaller
        working-directory: python
        run: pip install pytest pyinstaller -r requirements.txt

      - name: Build Python sidecar
        run: npm run python:bundle

      - name: Build Electron app
        run: npm run build

      # No signing secrets here: drop the notarize hook and Azure signing. On macOS
      # electron-builder signs ad hoc ("-"), with the hardened runtime and entitlements a
      # release has, so the engine runs under the same rules as in a release (and Apple
      # silicon needs a signature to launch at all).
      - name: Unsigned packaging config
        run: |
          node -e '
            const fs = require("fs"); const p = JSON.parse(fs.readFileSync("package.json"));
            delete p.build.afterSign; delete p.build.win.azureSignOptions;
            p.build.mac.identity = "-";
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2));'

      - name: Package (unpacked, no publish)
        run: npx electron-builder --dir --publish never

      # The public backups (about 5 GB) come from their publishers' sites: usually 2 to 5
      # minutes, sometimes far longer (18 on 2026-11-13). One copy of the downloads, shared
      # by Linux, macOS and Windows, is kept in the Actions cache: the Linux job saves it on
      # main, and every run restores it (branches can read main's caches). A cache shared
      # between systems needs the same relative path on each, hence a folder in the checkout
      # (Windows keeps the home folder on another drive). The key covers the chosen items'
      # download details in corpus/manifest.json, parsed so line endings don't change it;
      # fetch re-downloads anything the restored copy lacks or that no longer matches its hash.
      - name: Choose the public backups
        id: corpus
        env:
          ITEMS: ${{ inputs.items }}
        run: |
          # The end-to-end run needs pub-hickman-15.3.1 whatever the item list says.
          items=$(echo "$ITEMS,pub-hickman-15.3.1" | tr ',' '\n' | sed '/^$/d' | sort -u | tr '\n' ' ')
          hash=$(python - $items <<'EOF'
          import hashlib, json, sys
          fetch = {item["key"]: item["fetch"] for item in json.load(open("corpus/manifest.json", encoding="utf-8"))["items"]}
          chosen = {key: fetch[key] for key in sorted(sys.argv[1:])}
          print(hashlib.sha256(json.dumps(chosen, sort_keys=True).encode()).hexdigest()[:16])
          EOF
          )
          echo "Items: $items"
          echo "items=$items" >> "$GITHUB_OUTPUT"
          echo "key=corpus-public-$hash" >> "$GITHUB_OUTPUT"

      - name: Restore the public backups' downloads
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: .corpus-cache/pub-*/download
          key: ${{ steps.corpus.outputs.key }}
          restore-keys: corpus-public-
          enableCrossOsArchive: true

      - name: Fetch public backups
        id: fetch
        env:
          ITEMS: ${{ steps.corpus.outputs.items }}
        run: python -m corpus.fetch fetch $ITEMS

      - name: Save the public backups' downloads
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main' && steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .corpus-cache/pub-*/download
          key: ${{ steps.corpus.outputs.key }}
          enableCrossOsArchive: true

      - name: Corpus, packaged engine (public + generated)
        env:
          ITEMS: ${{ inputs.items }}
          OPENEXTRACT_CORPUS_REQUIRE: '1'
        run: |
          synthetic=$(python -c "from corpus.synthetic import load_synthetic; print(','.join(load_synthetic()))")
          export OPENEXTRACT_CORPUS_ITEMS="$ITEMS,$synthetic"
          export OPENEXTRACT_SIDECAR="$GITHUB_WORKSPACE/release/${{ matrix.engine }}"
          echo "Engine: $OPENEXTRACT_SIDECAR"
          echo "Items: $OPENEXTRACT_CORPUS_ITEMS"
          pytest python/tests/corpus -m corpus -q -rfE

      # Runs even when the corpus step fails, so one run shows both. Every end-to-end suite
      # (scripts/e2e) against the packaged app, plus the Hickman backup and the smoke suite.
      # PYTHONUTF8 is unset so the engine uses the OS's own text encoding, as it does for users.
      - name: End to end
        id: e2e
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.59.1
          python scripts/e2e/backups.py e2e-backups.json --hickman
          # Node on Windows needs C:\ paths, not Git Bash's /c/ ones.
          native() { if command -v cygpath >/dev/null; then cygpath -w "$1"; else echo "$1"; fi; }
          args=(scripts/e2e/run.mjs --app "$(native "$GITHUB_WORKSPACE/release/${{ matrix.app }}")" --backups e2e-backups.json --out e2e-out
                --suites first-run,open,screens,search,exports,empty,ipc,network,hickman,smoke)
          if [ "$RUNNER_OS" = Linux ]; then env -u PYTHONUTF8 xvfb-run -a -s '-screen 0 1600x1000x24' node "${args[@]}"; else env -u PYTHONUTF8 node "${args[@]}"; fi

      # Maren and einstein are fictional; the hickman suite keeps every Hickman screenshot and
      # export out of e2e-out.
      - name: Upload end-to-end results (maren only)
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ runner.os }}
          path: e2e-out
          retention-days: 5
