name: NSIS crash diagnosis (throwaway)

# Throwaway, on branch claude/nsis-crash-diag only. Builds the fix branch
# (electron-builder 26.12.1) signed and notarized the way release.yml does, without
# publishing, runs the App Control gate on it, and counts installer crashes (System.dll
# +0x1581) against the v0.11.0 release installer (electron-builder 26.8.1).

on:
  push:
    branches: [claude/nsis-crash-diag]
    paths: ['.github/workflows/nsis-crash-diag.yml', 'diag/**']

permissions:
  contents: read

env:
  FIX_REF: claude/nsis-fresh-install-crash
  OLD_TAG: v0.11.0
  TEST_VERSION: 0.11.1-ebfix

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.FIX_REF }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build and sign as release.yml does, without publishing
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          npm version "$TEST_VERSION" --no-git-tag-version
          npm install
          echo "electron-builder $(node -p "require('electron-builder/package.json').version"), app-builder-lib $(node -p "require('app-builder-lib/package.json').version")"
          grep -n 'SHGetKnownFolderPath\|lstrcpynW\|&w\$' node_modules/app-builder-lib/templates/nsis/multiUser.nsh
          git clone --depth=1 https://github.com/charleswest775/ios-backup-core.git "$GITHUB_WORKSPACE/../ios-backup-core"
          (cd python && pip install pyinstaller -r requirements.txt)
          npm run python:bundle
          npm run build
          npx electron-builder --publish never

      # release.yml's step, word for word apart from the version.
      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          . ./scripts/app-control/common.ps1
          $files = @(Get-PeFiles 'release/win-unpacked')
          $files += Get-Item -LiteralPath "release/OpenExtract Setup $env:TEST_VERSION.exe"
          if (-not (Test-Path 'release/win-unpacked/resources/python/_internal')) {
            Write-Output "::error::The engine is not the folder build (resources/python/_internal is missing)"
            exit 1
          }
          $unsigned = @($files | Where-Object { (Get-AuthenticodeSignature -LiteralPath $_.FullName).Status -ne 'Valid' })
          Write-Output "$($files.Count - $unsigned.Count) of $($files.Count) PE files are signed"
          foreach ($file in $unsigned) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
            Write-Output ("{0,-10} {1}" -f $sig.Status, $file.FullName)
          }
          if ($unsigned.Count -gt 0) {
            Write-Output "::error::$($unsigned.Count) Windows executable(s) or DLL(s) are not validly Authenticode-signed"
            exit 1
          }
          Get-ChildItem release -File | ForEach-Object { '{0,12} {1}' -f $_.Length, $_.Name }
          Get-Content release/latest.yml

      - uses: actions/upload-artifact@v4
        with:
          name: win-signed
          path: release/OpenExtract Setup *.exe
          retention-days: 3

  app-control:
    needs: build-windows
    permissions:
      contents: write
    uses: ./.github/workflows/windows-app-control.yml
    with:
      artifact: win-signed

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.FIX_REF }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install and build
        run: |
          npm version "$TEST_VERSION" --no-git-tag-version
          npm install
          echo "electron-builder $(node -p "require('electron-builder/package.json').version")"
          git clone --depth=1 https://github.com/charleswest775/ios-backup-core.git "$GITHUB_WORKSPACE/../ios-backup-core"
          (cd python && pip install pyinstaller -r requirements.txt)
          npm run python:bundle
          npm run build

      # release.yml's step, word for word.
      - name: Import signing certificate
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT="$RUNNER_TEMP/signing.p12"
          node -e "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.MAC_CERTIFICATE_P12, 'base64'))" "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          rm -f "$CERT"
          for CA in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$CA.cer" -o "$RUNNER_TEMP/$CA.cer"
            security import "$RUNNER_TEMP/$CA.cer" -k "$KEYCHAIN" || true
          done
          SEARCH_LIST=("$KEYCHAIN")
          while read -r KC; do SEARCH_LIST+=("${KC//\"/}"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "${SEARCH_LIST[@]}"
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN")"
          echo "$IDENTITIES"
          if ! grep -q "Developer ID Application" <<< "$IDENTITIES"; then
            echo "::error::No valid Developer ID Application identity after importing MAC_CERTIFICATE_P12"
            exit 1
          fi
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Package, sign and notarize (no publish)
        run: npx electron-builder --publish never
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Check the signature, notarization and Gatekeeper
        run: |
          ls -la release
          APP=release/mac-arm64/OpenExtract.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|Runtime|flags'
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          DMG=$(ls release/*.dmg | head -1)
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/oe-dmg "$DMG" >/dev/null
          spctl --assess --type execute --verbose=4 /tmp/oe-dmg/OpenExtract.app
          xcrun stapler validate /tmp/oe-dmg/OpenExtract.app
          hdiutil detach /tmp/oe-dmg >/dev/null
          ZIP=$(ls release/*-mac.zip | head -1)
          mkdir -p /tmp/oe-zip && ditto -x -k "$ZIP" /tmp/oe-zip
          spctl --assess --type execute --verbose=4 /tmp/oe-zip/OpenExtract.app
          cat release/latest-mac.yml

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  # Fresh installs of the v0.11.0 release installer (26.8.1) and the signed build above
  # (26.12.1), interleaved: silent, interactive, and upgrades over v0.11.0.
  trials:
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          name: win-signed
          path: new

      - name: Get the old installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:OLD_TAG --repo $env:GITHUB_REPOSITORY --pattern 'OpenExtract-Setup-*.exe' --dir old
          New-Item -ItemType Directory -Force installers | Out-Null
          Copy-Item (Get-ChildItem old -Filter *.exe)[0].FullName installers/oe-old.exe
          Copy-Item (Get-ChildItem new -Filter '*Setup*.exe')[0].FullName installers/oe-new.exe
          Get-ChildItem installers | ForEach-Object { '{0,12} {1} {2}' -f $_.Length, $_.Name, (Get-AuthenticodeSignature $_.FullName).Status }
          "session $((Get-Process -Id $PID).SessionId), interactive $([Environment]::UserInteractive)"
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting' -ErrorAction SilentlyContinue | Select-Object Disabled, DontShowUI, LoggingDisabled | Format-List | Out-String

      - name: Silent fresh installs
        run: |
          . ./diag/lib.ps1
          Enable-LocalDumps -ExeNames 'oe-old.exe', 'oe-new.exe' -Folder "$env:RUNNER_TEMP\dumps"
          $began = Get-Date
          $results = foreach ($i in 1..20) {
            foreach ($n in 'oe-old.exe', 'oe-new.exe') {
              Reset-Install
              $r = Invoke-Trial -Exe (Resolve-Path "installers/$n").Path
              Write-Host ("{0,3} {1,-11} {2,12} {3,6} ms installed={4}" -f $i, $n, $r.Code, $r.Ms, $r.Installed)
              [pscustomobject]@{ Variant = "silent $n"; Code = $r.Code; Ms = $r.Ms; Installed = $r.Installed }
            }
          }
          Reset-Install
          Write-Summary -Results $results -Title "Silent fresh installs, shard ${{ matrix.shard }}"
          Show-FaultEvents -Since $began

      # One-click without /S: shows its progress window, then starts the app (killed here).
      - name: Interactive fresh installs
        run: |
          . ./diag/lib.ps1
          $began = Get-Date
          $results = foreach ($i in 1..6) {
            foreach ($n in 'oe-old.exe', 'oe-new.exe') {
              Reset-Install
              $r = Invoke-Trial -Exe (Resolve-Path "installers/$n").Path -Arguments @()
              Start-Sleep -Seconds 3
              Write-Host ("{0,3} {1,-11} {2,12} {3,6} ms installed={4}" -f $i, $n, $r.Code, $r.Ms, $r.Installed)
              [pscustomobject]@{ Variant = "interactive $n"; Code = $r.Code; Ms = $r.Ms; Installed = $r.Installed }
            }
          }
          Reset-Install
          Write-Summary -Results $results -Title "Interactive (no /S) fresh installs, shard ${{ matrix.shard }}"
          Show-FaultEvents -Since $began

      - name: Upgrades over v0.11.0
        run: |
          . ./diag/lib.ps1
          $began = Get-Date
          $seed = [System.Collections.Generic.List[object]]::new()
          $results = foreach ($i in 1..4) {
            foreach ($n in 'oe-old.exe', 'oe-new.exe') {
              Reset-Install
              foreach ($a in 1..10) {
                $s = Invoke-Trial -Exe (Resolve-Path 'installers/oe-old.exe').Path
                $seed.Add([pscustomobject]@{ Variant = 'silent oe-old.exe (seeding the upgrade)'; Code = $s.Code; Ms = $s.Ms; Installed = $s.Installed })
                if ($s.Code -eq 0) { break }
              }
              $r = Invoke-Trial -Exe (Resolve-Path "installers/$n").Path
              Write-Host ("{0,3} {1,-11} over v0.11.0 {2,12} {3,6} ms installed={4}" -f $i, $n, $r.Code, $r.Ms, $r.Installed)
              [pscustomobject]@{ Variant = "upgrade $n over oe-old"; Code = $r.Code; Ms = $r.Ms; Installed = $r.Installed }
            }
          }
          Reset-Install
          Write-Summary -Results (@($results) + $seed) -Title "Silent upgrades over v0.11.0, shard ${{ matrix.shard }}"
          Show-FaultEvents -Since $began

      - name: Analyse a crash dump
        if: always()
        run: |
          . ./diag/lib.ps1
          Get-ChildItem "$env:RUNNER_TEMP\dumps" -Filter *.dmp -ErrorAction SilentlyContinue | Select-Object -First 1 | ForEach-Object { Show-Dump $_.FullName }

  # Full page heap puts every heap block against an inaccessible page, so the old
  # over-read faults every time instead of now and then.
  pageheap:
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          name: win-signed
          path: new

      - name: Trials under full page heap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./diag/lib.ps1
          gh release download $env:OLD_TAG --repo $env:GITHUB_REPOSITORY --pattern 'OpenExtract-Setup-*.exe' --dir old
          New-Item -ItemType Directory -Force installers | Out-Null
          Copy-Item (Get-ChildItem old -Filter *.exe)[0].FullName installers/oe-old.exe
          Copy-Item (Get-ChildItem new -Filter '*Setup*.exe')[0].FullName installers/oe-new.exe
          foreach ($n in 'oe-old.exe', 'oe-new.exe') {
            $k = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\$n"
            New-Item -Path $k -Force | Out-Null
            Set-ItemProperty -Path $k -Name GlobalFlag -Value '0x02000000'
            Set-ItemProperty -Path $k -Name PageHeapFlags -Value '0x3'
          }
          $began = Get-Date
          $results = foreach ($i in 1..6) {
            foreach ($n in 'oe-old.exe', 'oe-new.exe') {
              Reset-Install
              $r = Invoke-Trial -Exe (Resolve-Path "installers/$n").Path -KillAfter 30
              Write-Host ("{0,3} {1,-11} {2,12} {3,6} ms" -f $i, $n, $r.Code, $r.Ms)
              [pscustomobject]@{ Variant = "page heap $n"; Code = $r.Code; Ms = $r.Ms }
            }
          }
          Reset-Install
          Write-Summary -Results $results -Title 'Full page heap (alive = still running after 30 s, then killed)'
          Show-FaultEvents -Since $began
