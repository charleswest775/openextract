name: Release

# One run from version number to published release, about 15 to 20 minutes:
#   preflight   makes `release/vX.Y.Z` (version bump, CHANGELOG heading, the website's version
#               label), tags it and creates a draft release. About a minute.
#   checks      TypeScript, ruff, the Python tests and a build, on the tag.
#   prerelease  prerelease-check.yml on the tag: the backup corpus and every end-to-end suite
#               against unsigned packaged builds on Linux, macOS and Windows.
#   build-*     build, sign, notarize and upload each platform's packages to the draft.
#   windows-app-control, installers   test the draft's signed packages on fresh runners.
#   finalize    publishes once every job above has passed, adds the store packaging files
#               (winget, Chocolatey, Flatpak) to the release branch, and opens the sync PR.
#               openextract.app's download links follow the newest published release on their
#               own (website/static/api/_lib/download.js), so they switch when it publishes.
# checks, prerelease and the builds run side by side. If anything fails the release stays a
# draft: fix it, delete the draft and the tag (`gh release delete vX.Y.Z --cleanup-tag`), and
# run it again.
#
# The pipeline never pushes to `main`. Branch protection requires PRs, so the version bump
# and the rest reach main through the sync PR from `release/vX.Y.Z` (release/* is unprotected).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.4.0)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The maintainer's time zone: the release's date in CHANGELOG.md, the Flatpak metainfo and
  # winget's ReleaseDate is the date there, as it has been for every earlier release.
  RELEASE_TZ: America/Los_Angeles

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: v${{ inputs.version }}
      release_branch: release/v${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format '${{ inputs.version }}'. Expected: X.Y.Z"
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ inputs.version }}$"; then
            echo "::error::Tag v${{ inputs.version }} already exists"
            exit 1
          fi

      # --- Build the release branch with all version-bump commits ---
      - name: Create release branch
        run: |
          BRANCH="release/v${{ inputs.version }}"
          # Reset any stale remote branch from a prior failed run so we start
          # from a clean state on main.
          git push origin --delete "$BRANCH" || true
          git checkout -b "$BRANCH"

      - name: Bump package.json version if needed
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "${{ inputs.version }}" ]; then
            npm version "${{ inputs.version }}" --no-git-tag-version
            git add package.json package-lock.json
            git commit -m "chore: bump version to ${{ inputs.version }}"
            echo "Bumped version from $CURRENT to ${{ inputs.version }}"
          else
            echo "Version already matches ${{ inputs.version }}"
          fi

      # `## [X.Y.Z] - <date>` under an empty `## [Unreleased]`. Warns (and goes on) if
      # Unreleased has nothing in it.
      - name: Date the release in CHANGELOG.md
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/release-files.mjs changelog "$VERSION" "$(TZ="$RELEASE_TZ" date +%F)"
          if ! git diff --quiet CHANGELOG.md; then
            git add CHANGELOG.md
            git commit -m "CHANGELOG: $VERSION"
          fi

      # The version label in the home page's nav: what the page shows until /api/latest answers
      # (website/static/api/_lib/download.js). The download links need nothing here: they
      # follow the newest published release on their own.
      - name: Update the website's version label
        run: |
          INDEX="website/static/index.html"
          sed -i "s|<span class=\"nav__version\">v[^<]*</span>|<span class=\"nav__version\">v${{ inputs.version }}</span>|" "$INDEX"
          if git diff --quiet "$INDEX"; then
            grep -q 'class="nav__version">v${{ inputs.version }}<' "$INDEX" || echo "::warning::$INDEX has no nav__version label to update"
          else
            git add "$INDEX"
            git commit -m "chore: website version label v${{ inputs.version }}"
          fi

      # --- Push release branch (release/* is not protected) and tag ---
      - name: Push release branch
        run: git push --set-upstream origin "release/v${{ inputs.version }}"

      - name: Create and push tag
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      # Left to itself, --generate-notes compared v0.9.0 against v0.3.4 and
      # listed ~75 PRs (release tags sit on release/* branches, off main's
      # history). Start the notes at the previous version's tag instead.
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          PREV=$( (git tag -l 'v[0-9]*.[0-9]*.[0-9]*'; echo "v$VERSION") \
            | sort -uV | grep -B1 -x "v$VERSION" | grep -vx "v$VERSION" | head -n1 || true)
          NOTES_FROM=()
          if [ -n "$PREV" ]; then
            echo "Release notes start at $PREV"
            NOTES_FROM=(--notes-start-tag "$PREV")
          fi
          gh release create "v$VERSION" \
            --draft \
            --generate-notes \
            "${NOTES_FROM[@]}" \
            --title "v$VERSION"

  # The quality gates that used to hold up the builds. They run beside them now; finalize
  # waits for them before publishing.
  checks:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: v${{ inputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements*.txt

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check (renderer)
        run: npx tsc --noEmit

      - name: TypeScript check (electron)
        run: npx tsc --noEmit -p tsconfig.electron.json

      # python/requirements.txt installs ios-backup-core via `-e ../../ios-backup-core`.
      # The expected layout is openextract/ and ios-backup-core/ as siblings on disk,
      # so clone ios-backup-core one level above $GITHUB_WORKSPACE before pip runs.
      # TODO: remove this step once ios-backup-core ships to PyPI and requirements.txt
      # pins a versioned release instead of the editable path install.
      - name: Clone ios-backup-core (sibling for editable install)
        shell: bash
        run: |
          git clone --depth=1 \
            https://github.com/charleswest775/ios-backup-core.git \
            "$GITHUB_WORKSPACE/../ios-backup-core"

      - name: Cache the generated backups' photos
        uses: ./.github/actions/backupgen-media

      # Run from python/ so pip resolves `-e ../../ios-backup-core` the same
      # way it does locally (README tells devs to `cd python` first).
      - name: Install Python dependencies
        working-directory: python
        run: pip install ruff pytest -r requirements.txt

      - name: Python lint
        run: ruff check python/

      - name: Python tests
        run: pytest python/tests/ -v

      - name: Build verification
        run: npm run build

  # The backup corpus and every end-to-end suite against unsigned packaged builds of the tag
  # (prerelease-check.yml). Publishing waits for it.
  prerelease:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/prerelease-check.yml
    with:
      ref: v${{ inputs.version }}

  build-macos:
    needs: preflight
    runs-on: macos-latest
    # build/notarize.js waits up to 45 minutes for Apple's verdict before the dmg is built.
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: v${{ inputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm install

      # See preflight job for rationale on sibling-clone + working-directory.
      - name: Clone ios-backup-core (sibling for editable install)
        shell: bash
        run: |
          git clone --depth=1 \
            https://github.com/charleswest775/ios-backup-core.git \
            "$GITHUB_WORKSPACE/../ios-backup-core"

      - name: Install Python dependencies and PyInstaller
        working-directory: python
        run: pip install pyinstaller -r requirements.txt

      - name: Build Python sidecar
        run: npm run python:bundle

      - name: Build Electron app
        run: npm run build

      # electron-builder's own certificate import (CSC_LINK) runs
      # `security set-key-partition-list` with the certificate's password instead of
      # the keychain's. The macos-26 runner rejects that ("SecKeychainUnlock: The user
      # name or passphrase you entered is not correct"), so import the certificate here
      # into a keychain we hold the password for. Without CSC_LINK, electron-builder
      # signs with the identity it finds in CSC_KEYCHAIN.
      - name: Import signing certificate
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT="$RUNNER_TEMP/signing.p12"
          # Decode the secret the same way electron-builder decodes CSC_LINK.
          node -e "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.MAC_CERTIFICATE_P12, 'base64'))" "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          rm -f "$CERT"

          # Apple's Developer ID intermediates, so the identity validates on any runner
          # image. "Already exists" (the .p12 may carry one) is fine: the check below is
          # what decides.
          for CA in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$CA.cer" -o "$RUNNER_TEMP/$CA.cer"
            security import "$RUNNER_TEMP/$CA.cer" -k "$KEYCHAIN" || true
          done
          # Put the keychain first in the user search list, which codesign uses.
          SEARCH_LIST=("$KEYCHAIN")
          while read -r KC; do SEARCH_LIST+=("${KC//\"/}"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "${SEARCH_LIST[@]}"

          # electron-builder falls back to ad-hoc signing when it finds no identity, so fail here.
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN")"
          echo "$IDENTITIES"
          if ! grep -q "Developer ID Application" <<< "$IDENTITIES"; then
            echo "::error::No valid Developer ID Application identity after importing MAC_CERTIFICATE_P12"
            exit 1
          fi
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # Signs every binary in the app with the Developer ID (the engine's .so and .dylib
      # files included), then build/notarize.js (afterSign) notarizes the app, waits for
      # Apple to accept it and staples the ticket, before the dmg and zip are built. A
      # rejection fails this step and the release stays a draft; the notary log is printed.
      - name: Package and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  build-windows:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: v${{ inputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm install

      # See preflight job for rationale on sibling-clone + working-directory.
      - name: Clone ios-backup-core (sibling for editable install)
        shell: bash
        run: |
          git clone --depth=1 \
            https://github.com/charleswest775/ios-backup-core.git \
            "$GITHUB_WORKSPACE/../ios-backup-core"

      - name: Install Python dependencies and PyInstaller
        working-directory: python
        run: pip install pyinstaller -r requirements.txt

      - name: Build Python sidecar
        run: npm run python:bundle

      - name: Build Electron app
        run: npm run build

      - name: Package and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # build/sign-windows.js (afterPack) signs every DLL, .pyd and other non-.exe PE file in
      # the packed app in one batch; electron-builder signs the .exe files, the installer
      # and the uninstaller. Smart App Control refuses to load unsigned code (#169), and the
      # Microsoft Store requires every .exe and .dll to be signed. Check every PE file, found
      # by content rather than extension, along with the installer; failing here keeps the
      # release in draft. windows-app-control checks the installed app the same way, and
      # loads it under App Control.
      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          . ./scripts/app-control/common.ps1
          $files = @(Get-PeFiles 'release/win-unpacked')
          $files += Get-Item -LiteralPath 'release/OpenExtract Setup ${{ inputs.version }}.exe'
          if (-not (Test-Path 'release/win-unpacked/resources/python/_internal')) {
            Write-Output "::error::The engine is not the folder build (resources/python/_internal is missing)"
            exit 1
          }
          $unsigned = @($files | Where-Object { (Get-AuthenticodeSignature -LiteralPath $_.FullName).Status -ne 'Valid' })
          Write-Output "$($files.Count - $unsigned.Count) of $($files.Count) PE files are signed"
          foreach ($file in $unsigned) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
            Write-Output ("{0,-10} {1}" -f $sig.Status, $file.FullName)
          }
          if ($unsigned.Count -gt 0) {
            Write-Output "::error::$($unsigned.Count) Windows executable(s) or DLL(s) are not validly Authenticode-signed"
            exit 1
          }

      # The updater fetches whatever latest.yml names. Point it at OpenExtract-Update-<v>.exe, a
      # copy of the signed installer, so the release's download counts tell updates apart from
      # new installs (the website, winget and Chocolatey give OpenExtract-Setup-<v>.exe).
      # scripts/update-feed.mjs says more, including the one full download it costs.
      - name: Give updates their own copy of the installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/update-feed.mjs release "$VERSION"
          cd release
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber \
            "OpenExtract-Update-$VERSION.exe" "OpenExtract-Update-$VERSION.exe.blockmap" latest.yml

  # Installs the draft's Windows installer on a fresh runner and runs it under an enforced
  # App Control policy that allows only Microsoft's code and ours, the way Smart App
  # Control would (#169). Publishing waits for it.
  windows-app-control:
    needs: [preflight, build-windows]
    permissions:
      contents: write
    uses: ./.github/workflows/windows-app-control.yml
    with:
      tag: v${{ inputs.version }}

  build-linux:
    needs: preflight
    runs-on: ubuntu-latest
    # Build inside the oldest distro we support, not on the runner's own OS. PyInstaller
    # bundles the build system's libpython and shared libraries, so the engine needs at
    # least that system's glibc: built on ubuntu-24.04 it needed GLIBC_2.38 and failed to
    # start on Ubuntu 22.04 (glibc 2.35) and Debian 12 (2.36). The ubuntu-22.04 runner
    # image is being retired (2027-04-17), so use the container image instead.
    container: ubuntu:22.04
    env:
      # The runner mounts its own tool cache into the container (at /__t), and setup-python
      # would reuse the Python 3.11 in it, which is built for the runner's OS and so has
      # the same glibc problem. A tool cache inside the container makes setup-python
      # download its Ubuntu 22.04 build instead. Not /opt/hostedtoolcache: that is the
      # runner's own path, and the runner rewrites it to /__t.
      AGENT_TOOLSDIRECTORY: /opt/toolcache
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      # Before checkout: the container has no git. PyInstaller needs objdump (binutils);
      # the .deb is xz-compressed (xz-utils). setup-python's build links to the system's
      # libsqlite3 and libreadline, which PyInstaller then bundles; without libsqlite3 the
      # engine can't open a backup.
      - name: Install Linux build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates binutils xz-utils libarchive-tools libsqlite3-0 libreadline8

      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: v${{ inputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # PyInstaller only warns about a missing library, so check them here: a build
      # without one would ship an engine that fails when it first needs it.
      - name: Check Python's system libraries
        run: python -c "import sqlite3, ssl, ctypes, lzma, bz2, zlib, readline"

      - name: Install Node dependencies
        run: npm install

      # See preflight job for rationale on sibling-clone + working-directory.
      - name: Clone ios-backup-core (sibling for editable install)
        shell: bash
        run: |
          git clone --depth=1 \
            https://github.com/charleswest775/ios-backup-core.git \
            "$GITHUB_WORKSPACE/../ios-backup-core"

      - name: Install Python dependencies and PyInstaller
        working-directory: python
        run: pip install pyinstaller -r requirements.txt

      - name: Build Python sidecar
        run: npm run python:bundle

      - name: Build Electron app
        run: npm run build

      - name: Package and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Installs the draft's packages on fresh macOS, Windows and Linux runners: Gatekeeper and
  # signatures, silent install and upgrade over the previous release, the installed app's
  # smoke test, update metadata, uninstall. See installers.yml. Publishing waits for it.
  installers:
    needs: [preflight, build-macos, build-windows, build-linux]
    permissions:
      contents: write
    uses: ./.github/workflows/installers.yml
    with:
      tag: v${{ inputs.version }}

  finalize:
    needs: [preflight, checks, prerelease, build-macos, build-windows, build-linux, windows-app-control, installers]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: release/v${{ inputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history + all branches so `origin/main..HEAD` resolves in the
          # sync-PR step below. Default shallow checkout only fetches the ref
          # we asked for, so origin/main is missing from the local repo.
          fetch-depth: 0

      - name: Fetch main for comparison
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      # openextract.app's download links give the newest published release's files by name
      # (website/static/api/_lib/download.js), so every one of those names must be in this
      # release, or its link breaks the moment it's published. Checked while it's a draft.
      - name: Check the website's download links will find this release's files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=$(gh release view "v${{ inputs.version }}" --json assets --jq '.assets[].name')
          FAILED=0
          while read -r PLATFORM NAME; do
            if grep -qxF "$NAME" <<< "$ASSETS"; then
              echo "/download/$PLATFORM/file -> $NAME"
            else
              echo "::error::/download/$PLATFORM/file would give $NAME, which v${{ inputs.version }} does not have"
              FAILED=1
            fi
          done < <(node website/static/api/_lib/download.js "${{ inputs.version }}")
          exit $FAILED

      - name: Publish release (remove draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ inputs.version }}" --draft=false

      # The live site's download links should give this release now. Each try adds its own
      # query, so the edge cache can't answer with an earlier lookup. Only a warning if not:
      # the release is already out, and the links fall back to GitHub's release page.
      - name: Check openextract.app's download links give the new version
        continue-on-error: true
        env:
          VERSION: ${{ inputs.version }}
        run: |
          links_ok() {
            local ok=0 location
            while read -r PLATFORM NAME; do
              location=$(curl -sS -o /dev/null -w '%{redirect_url}' "https://www.openextract.app/download/$PLATFORM/file?check=$GITHUB_RUN_ID-$1" || true)
              location=${location%%\?*} # a vercel.json redirect passes the query on
              echo "/download/$PLATFORM/file -> ${location:-no redirect}"
              [[ "$location" == */releases/download/v$VERSION/$NAME ]] || ok=1
            done < <(node website/static/api/_lib/download.js "$VERSION")
            return $ok
          }
          for try in 1 2 3 4 5 6; do
            links_ok "$try" && exit 0
            sleep 20
          done
          echo "::warning::openextract.app's download links don't give v$VERSION yet. Check them (RELEASING.md, step 3)."
          exit 1

      # winget, Chocolatey and Flatpak files for this version, from the published release's
      # checksums and the CHANGELOG (scripts/release-files.mjs), so the sync PR carries them
      # and there's no separate packaging PR. After publishing, and allowed to fail: the
      # release matters more, and the files can still be done by hand (packaging/README.md).
      - name: Add the store packaging files to the release branch
        id: packaging
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          sha256_of() {
            local name=$1 digest
            digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" --jq ".assets[] | select(.name == \"$name\") | .digest // empty")
            if [[ "$digest" == sha256:* ]]; then echo "${digest#sha256:}"; return; fi
            # Older API answers have no digest: download the file and hash it.
            gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$name" --output - | sha256sum | cut -d' ' -f1
          }
          EXE=$(sha256_of "OpenExtract-Setup-$VERSION.exe")
          DEB=$(sha256_of "openextract_${VERSION}_amd64.deb")
          echo "OpenExtract-Setup-$VERSION.exe sha256 $EXE"
          echo "openextract_${VERSION}_amd64.deb sha256 $DEB"
          node scripts/release-files.mjs packaging "$VERSION" "$(TZ="$RELEASE_TZ" date +%F)" --exe-sha256 "$EXE" --deb-sha256 "$DEB"
          git add packaging
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "packaging: winget, Chocolatey and Flatpak for v$VERSION"
          git push origin "HEAD:release/v$VERSION"

      # Open a PR so main picks up the version bump, CHANGELOG heading, version label and
      # packaging files. This is the only path for those changes to reach main under the
      # required-PR-review branch protection policy.
      - name: Open sync PR to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Skip if the branch has no commits ahead of main (unchanged release).
          AHEAD=$(git rev-list --count origin/main..HEAD)
          if [ "$AHEAD" = "0" ]; then
            echo "No commits ahead of main — nothing to sync."
            exit 0
          fi
          # Reuse existing PR if one is already open from this branch.
          EXISTING=$(gh pr list --head "release/v${{ inputs.version }}" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Sync PR already open: #$EXISTING"
            exit 0
          fi
          gh pr create \
            --base main \
            --head "release/v${{ inputs.version }}" \
            --title "chore: release v${{ inputs.version }}" \
            --body-file - <<EOF
          Opened by the Release workflow after v${{ inputs.version }} was published. Merging it brings \`main\` up to date:

          - the version in \`package.json\` and \`package-lock.json\`;
          - \`## [${{ inputs.version }}]\` in \`CHANGELOG.md\`;
          - the version label in \`website/static/index.html\` (only what the home page shows before it hears from \`/api/latest\`: openextract.app's download links and label already give v${{ inputs.version }});
          - $([ "${{ steps.packaging.outcome }}" = success ] && echo "the winget, Chocolatey and Flatpak files in \`packaging/\`." || echo "**not** the winget, Chocolatey and Flatpak files: the workflow couldn't write them (see its log), so add them by hand as \`packaging/README.md\` says.")

          Then follow RELEASING.md's steps after publishing.
          EOF

      - name: Summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Release v${{ inputs.version }} published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          gh release view "v${{ inputs.version }}" --json assets --jq '.assets[] | "- \(.name) (\(.size / 1048576 | floor)MB)"' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View release](https://github.com/${{ github.repository }}/releases/tag/v${{ inputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next step" >> $GITHUB_STEP_SUMMARY
          echo "Merge the [sync PR](https://github.com/${{ github.repository }}/pulls?q=is%3Apr+is%3Aopen+head%3Arelease%2Fv${{ inputs.version }}) to update \`main\`." >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.packaging.outcome }}" != success ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**The store packaging files weren't added** (see the step's log): add them to the release branch by hand (packaging/README.md)." >> $GITHUB_STEP_SUMMARY
          fi
