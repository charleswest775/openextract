name: Corpus (weekly)

# Runs the backup corpus tests (python/tests/corpus) against real public iPhone
# backups. See docs/BACKUP_TEST_CORPUS_PLAN.md and corpus/README.md.

on:
  schedule:
    - cron: '23 7 * * 1'  # Mondays 07:23 UTC
  workflow_dispatch:
    inputs:
      items:
        description: 'Comma-separated corpus items (blank = every item in the weekly tier)'
        required: false
        default: ''
      ios_backup_core_ref:
        description: 'ios-backup-core branch or tag to test against'
        required: false
        default: 'master'

concurrency:
  group: corpus-weekly
  cancel-in-progress: false

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENEXTRACT_CORPUS_REQUIRE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements*.txt

      # Same sibling layout as ci.yml: python/requirements.txt installs
      # ios-backup-core from ../../ios-backup-core.
      - name: Clone ios-backup-core (sibling for editable install)
        env:
          REF: ${{ inputs.ios_backup_core_ref || 'master' }}
        run: |
          git clone --depth=1 --branch "$REF" \
            https://github.com/charleswest775/ios-backup-core.git \
            "$GITHUB_WORKSPACE/../ios-backup-core"

      - name: Install Python dependencies
        working-directory: python
        run: pip install pytest -r requirements.txt

      - name: Choose items
        id: items
        env:
          ITEMS: ${{ inputs.items }}
        run: |
          if [ -z "$ITEMS" ]; then
            ITEMS=$(python -c "from corpus.manifest import load_manifest; print(','.join(k for k, i in load_manifest().items() if 'weekly' in i.tiers))")
          fi
          echo "Testing: $ITEMS"
          echo "keys=$ITEMS" >> "$GITHUB_OUTPUT"

      - name: Restore corpus downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/openextract-corpus/*/download
          key: corpus-${{ steps.items.outputs.keys }}-${{ hashFiles('corpus/manifest.json') }}
          restore-keys: corpus-${{ steps.items.outputs.keys }}-

      - name: Fetch and verify items
        env:
          ITEMS: ${{ steps.items.outputs.keys }}
        run: python -m corpus.fetch fetch $(echo "$ITEMS" | tr ',' ' ')

      - name: Corpus tests
        env:
          OPENEXTRACT_CORPUS_ITEMS: ${{ steps.items.outputs.keys }}
        run: pytest python/tests/corpus -m corpus -v
