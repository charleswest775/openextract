name: Installers

# Installs the packages people download (dmg and zip, NSIS installer, deb and AppImage) on
# fresh macOS, Windows and Linux runners, checks what landed where, runs the end-to-end smoke
# suite against the installed app, upgrades over the previous release, and uninstalls. See
# scripts/installers/test-installers.mjs and docs/TESTING.md.
#
# Without a tag it builds unsigned packages the way release.yml does (Linux inside Ubuntu
# 22.04, for glibc) and tests those. release.yml calls it with the draft release's tag, so the
# signed packages users will get are tested before the release is published.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Test this release''s packages (it may still be a draft) instead of building'
        type: string
        required: false
        default: ''
      ios_backup_core_ref:
        description: 'ios-backup-core branch, tag or full commit SHA to build and make the test backups with (blank = the commit pinned in ios-backup-core.ref). release.yml passes the commit it built.'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to test (blank = build unsigned packages from this branch)'
        required: false
        default: ''
      ios_backup_core_ref:
        description: 'ios-backup-core branch, tag or full commit SHA to build and make the test backups with (blank = the commit pinned in ios-backup-core.ref of the branch or tag tested). To test what a release shipped, or a tag from before the pin, give the commit named at the foot of its release notes (v0.16.0 on)'
        required: false
        default: ''
  schedule:
    - cron: '41 6 * * 1'  # Mondays 06:41 UTC
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'build/**'
      - 'electron/main.ts'
      - 'python/requirements.txt'
      # Moving the pin changes the engine that gets bundled, like a dependency bump.
      - 'ios-backup-core.ref'
      - 'scripts/bundle-engine.mjs'
      - 'scripts/installers/**'
      - 'scripts/update-feed.mjs'
      - '.github/workflows/installers.yml'

concurrency:
  group: installers-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ !inputs.tag }}

permissions:
  contents: read

jobs:
  # One ios-backup-core commit for the build and the test jobs, resolved once, so a branch given
  # by hand can't move between them. With a tag nothing is built, and the test job reads the
  # tag's pin (or uses the commit given) itself.
  ios_backup_core:
    if: ${{ !inputs.tag }}
    name: ios-backup-core commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.core.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve ios-backup-core
        id: core
        uses: ./.github/actions/ios-backup-core
        with:
          ref: ${{ inputs.ios_backup_core_ref || 'pinned' }}

  build:
    needs: ios_backup_core
    if: ${{ !inputs.tag }}
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-latest
            container: ubuntu:22.04
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # electron-builder skips all macOS signing on pull requests unless this is set. Only
      # the ad hoc signature below is made here; this job has no signing secrets.
      CSC_FOR_PULL_REQUEST: 'true'
      # See release.yml's build-linux: make setup-python fetch its Ubuntu 22.04 build.
      AGENT_TOOLSDIRECTORY: ${{ matrix.container && '/opt/toolcache' || '' }}
    steps:
      - name: Install Linux build dependencies
        if: matrix.container
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates binutils xz-utils libarchive-tools libsqlite3-0 libreadline8

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Check out ios-backup-core (sibling for editable install)
        uses: ./.github/actions/ios-backup-core
        with:
          ref: ${{ needs.ios_backup_core.outputs.sha }}

      - name: Install Python dependencies and PyInstaller
        working-directory: python
        run: pip install pyinstaller -r requirements.txt

      - name: Build Python sidecar
        run: npm run python:bundle

      - name: Build Electron app
        run: npm run build

      # Same as prerelease-check.yml: no signing secrets, so no notarizing or Azure signing.
      # On macOS electron-builder signs ad hoc ("-") instead of with the Developer ID, but
      # otherwise as a release does: every binary in the app, each of the engine's .so and
      # .dylib files included, with the hardened runtime and our entitlements. The macOS
      # test checks each one, which notarization would otherwise be first to catch.
      - name: Unsigned packaging config
        run: |
          node -e '
            const fs = require("fs"); const p = JSON.parse(fs.readFileSync("package.json"));
            delete p.build.afterSign; delete p.build.win.azureSignOptions;
            p.build.mac.identity = "-";
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2));'

      - name: Package (no publish)
        run: npx electron-builder --publish never

      # As release.yml does: updates get their own copy of the installer, which latest.yml names.
      # The Windows test checks latest.yml against the file it names.
      - name: Give updates their own copy of the installer
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/update-feed.mjs release "$(node -p "require('./package.json').version")"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: |
            release/*.dmg
            release/*-mac.zip
            release/*.exe
            release/*.deb
            release/*.AppImage
            release/latest*.yml
          retention-days: 3
          if-no-files-found: error

  # A draft release's assets can only be read with write access, so this small job fetches
  # them and hands them to the test jobs, which stay read-only.
  fetch:
    if: inputs.tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Download the release's packages
        run: |
          get() { d=$1; shift; mkdir -p "$d"; args=(); for p in "$@"; do args+=(--pattern "$p"); done; gh release download "$TAG" --repo "$GITHUB_REPOSITORY" "${args[@]}" --dir "$d"; }
          get packages/macOS '*-mac.zip' '*.dmg' 'latest-mac.yml'
          get packages/Windows 'OpenExtract-Setup-*.exe' 'OpenExtract-Update-*.exe' 'latest.yml'
          get packages/Linux '*.deb' '*.AppImage' 'latest-linux.yml'
          ls -laR packages

      - uses: actions/upload-artifact@v4
        with: { name: packages-macOS, path: packages/macOS, retention-days: 3, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        with: { name: packages-Windows, path: packages/Windows, retention-days: 3, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        with: { name: packages-Linux, path: packages/Linux, retention-days: 3, if-no-files-found: error }

  test:
    needs: [ios_backup_core, build, fetch]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.fetch.result == 'success') }}
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Node dependencies and Playwright
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright-core@1.59.1

      - name: Download the packages to test
        uses: actions/download-artifact@v5
        with:
          name: packages-${{ runner.os }}
          path: packages

      # The last published release, to upgrade from (not the one under test).
      - name: Download the previous release's packages
        run: |
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 5 --json tagName --jq '.[].tagName' | grep -vx "${TAG:-none}" | head -n1)
          echo "Previous release: $prev"
          mkdir -p previous
          case "$RUNNER_OS" in
            Windows) gh release download "$prev" --repo "$GITHUB_REPOSITORY" --pattern 'OpenExtract-Setup-*.exe' --dir previous ;;
            Linux)   gh release download "$prev" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir previous ;;
          esac
          ls -la previous

      # Fresh package lists, so apt can resolve the .deb's dependencies.
      - name: Update apt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends desktop-file-utils xvfb

      # The same fetch as .github/actions/ios-backup-core, written out because this job
      # checks out the tag under test, and an older tag doesn't have that action. Without a tag
      # it gets the commit the ios_backup_core job resolved (the one the packages were built
      # with). With a tag, blank means the commit pinned in the tag's ios-backup-core.ref, read
      # as the action does. scripts/ios-backup-core-pin.test.mjs runs this script.
      - name: Check out ios-backup-core (sibling for editable install)
        env:
          CORE_REF: ${{ needs.ios_backup_core.outputs.sha || inputs.ios_backup_core_ref }}
        run: |
          if [ -z "$CORE_REF" ]; then
            if [ ! -f ios-backup-core.ref ]; then
              echo "::error::This checkout (${TAG:-$GITHUB_REF_NAME}) has no ios-backup-core.ref: it's older than the pin. Run again with ios_backup_core_ref set to the commit named at the foot of that release's notes (\"Built with ios-backup-core ...\", from v0.16.0 on)."
              exit 1
            fi
            CORE_REF=$(tr -d '[:space:]' < ios-backup-core.ref)
            if [[ ! "$CORE_REF" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error file=ios-backup-core.ref::ios-backup-core.ref must hold one full 40-character commit SHA (lowercase hex), but holds '$CORE_REF'. scripts/bump-ios-backup-core.sh writes it."
              exit 1
            fi
          fi
          core="$GITHUB_WORKSPACE/../ios-backup-core"
          git init -q "$core"
          git -C "$core" fetch -q --depth=1 --no-tags https://github.com/charleswest775/ios-backup-core.git "$CORE_REF"
          git -C "$core" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          echo "ios-backup-core: $CORE_REF -> $(git -C "$core" rev-parse HEAD)"

      # As .github/actions/backupgen-media does (same key, so it finds CI's cache), written out
      # here because this job checks out the tag under test, which may predate that action.
      - name: Key for the generated backups' photos
        id: media
        run: |
          echo "BACKUPGEN_MEDIA_CACHE=$RUNNER_TEMP/backupgen-media" >> "$GITHUB_ENV"
          echo "path=$RUNNER_TEMP/backupgen-media" >> "$GITHUB_OUTPUT"
          echo "key=backupgen-media-${{ runner.os }}-$(python -c "import hashlib, glob; print(hashlib.sha256(b''.join(open(f, 'rb').read() for f in sorted(glob.glob('../ios-backup-core/backupgen/personas/*/photos.json')))).hexdigest()[:16])")" >> "$GITHUB_OUTPUT"

      - name: Cache the generated backups' photos
        uses: actions/cache@v4
        with:
          path: ${{ steps.media.outputs.path }}
          key: ${{ steps.media.outputs.key }}

      - name: Generate the test backups
        run: |
          (cd python && pip install -r requirements.txt)
          python scripts/e2e/backups.py e2e-backups.json

      - name: Install and test
        env:
          SIGNED: ${{ inputs.tag && '--signed' || '' }}
        run: |
          # Node on Windows needs C:\ paths, not Git Bash's /c/ ones.
          native() { if command -v cygpath >/dev/null; then cygpath -w "$1"; else echo "$1"; fi; }
          node scripts/installers/test-installers.mjs --dir "$(native "$PWD/packages")" --previous "$(native "$PWD/previous")" \
            --backups "$(native "$PWD/e2e-backups.json")" --out "$(native "$PWD/installer-out")" $SIGNED

      # The smoke suite only screenshots the fictional maren backup.
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}${{ inputs.tag && format('-{0}', inputs.tag) || '' }}
          path: installer-out
          retention-days: 14
          if-no-files-found: ignore
