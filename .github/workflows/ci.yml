name: CI

# Every pull request runs every layer of tests on Linux, macOS and Windows (see docs/TESTING.md):
#   check   TypeScript and the build (OS-independent, Linux only)
#   js      npm test: renderer logic, the Electron main process, the engine client, and the
#           guards that fail when a screen, export, IPC channel or engine method has no test
#   python  the engine's tests, its JSON-RPC contract (every method), and the generated corpus
#   e2e     the real app driven end to end: every screen, every export, the IPC bridge,
#           performance budgets, and no network traffic
# Installers are tested by installers.yml, release candidates by prerelease-check.yml.
# Hosted runners only: this repo is public, and a self-hosted runner would run fork PRs' code.
#
# macOS runs all of its layers in one job, e2e (macos-latest), so each run asks for one macOS
# runner instead of three. GitHub's macOS arm64 runners are short on capacity, and a job that
# waits too long for one is dropped ("The job was not acquired by Runner of type hosted"),
# which failed PRs whose code was fine.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check (renderer)
        run: npx tsc --noEmit

      - name: TypeScript check (electron)
        run: npx tsc --noEmit -p tsconfig.electron.json

      - name: Build verification
        run: npm run build

  js:
    name: js (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS: in e2e (macos-latest), see the top of this file.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements*.txt

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      # So scripts/sidecar.test.mjs also runs its checks against the real engine.
      - name: Install the engine's Python dependencies
        run: |
          git clone --depth=1 https://github.com/charleswest775/ios-backup-core.git "$GITHUB_WORKSPACE/../ios-backup-core"
          (cd python && pip install -r requirements.txt)
          echo "OPENEXTRACT_TEST_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: JS tests
        run: npm test

  # The engine reads backups with paths, temp files and SQLite handles that behave
  # differently on each OS, so its tests run on all three we ship for.
  python:
    name: python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS: in e2e (macos-latest), see the top of this file.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      # The contract tests (test_rpc_contract.py) fail rather than skip without their backups.
      OPENEXTRACT_REQUIRE_GENERATED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements*.txt

      # python/requirements.txt installs ios-backup-core via `-e ../../ios-backup-core`.
      # The expected layout is openextract/ and ios-backup-core/ as siblings on disk,
      # so clone ios-backup-core one level above $GITHUB_WORKSPACE before pip runs.
      # TODO: remove this step once ios-backup-core ships to PyPI and requirements.txt
      # pins a versioned release instead of the editable path install.
      - name: Clone ios-backup-core (sibling for editable install)
        run: |
          git clone --depth=1 \
            https://github.com/charleswest775/ios-backup-core.git \
            "$GITHUB_WORKSPACE/../ios-backup-core"

      # Maren's 170 public-domain photos come from Wikimedia Commons on first use (~140 MB).
      - name: Cache the generated backups' photos
        uses: ./.github/actions/backupgen-media

      # Run from python/ so pip resolves `-e ../../ios-backup-core` the same
      # way it does locally (README tells devs to `cd python` first).
      - name: Install Python dependencies
        working-directory: python
        run: pip install ruff pytest -r requirements.txt

      - name: Python lint
        if: runner.os == 'Linux'
        run: ruff check python/ corpus/

      - name: Python tests
        run: pytest python/tests/ -v

      # Backups generated by ios-backup-core's backupgen (the 'pr' tier in
      # corpus/synthetic.json), checked against their answer keys. Corpus tests are
      # opt-in, hence -m corpus; they skip until the ios-backup-core clone has backupgen.
      - name: Corpus tests on generated backups
        run: pytest python/tests/corpus -m corpus -v

  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    # No PYTHONUTF8 here: the app's engine runs with the OS's own text encoding, as it does
    # for users.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements*.txt

      - name: Install Node dependencies and Playwright
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright-core@1.59.1

      - name: Install the engine's Python dependencies
        id: engine-deps
        run: |
          git clone --depth=1 https://github.com/charleswest775/ios-backup-core.git "$GITHUB_WORKSPACE/../ios-backup-core"
          (cd python && pip install -r requirements.txt)
          echo "OPENEXTRACT_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Cache the generated backups' photos
        uses: ./.github/actions/backupgen-media

      - name: Generate the test backups
        run: python scripts/e2e/backups.py e2e-backups.json

      - name: Build
        run: npm run build

      - name: End to end
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s '-screen 0 1600x1000x24' node scripts/e2e/run.mjs --backups e2e-backups.json --out e2e-out
          else
            node scripts/e2e/run.mjs --backups e2e-backups.json --out e2e-out
          fi

      # macOS only: the js and python jobs' tests, here so macOS needs one runner per run.
      # They run even when End to end fails, so one failure doesn't hide another.
      - name: JS tests (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.engine-deps.outcome == 'success' }}
        env:
          OPENEXTRACT_TEST_PYTHON: ${{ env.OPENEXTRACT_PYTHON }}
        run: npm test

      - name: Python tests (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.engine-deps.outcome == 'success' }}
        env:
          PYTHONUTF8: '1'
          OPENEXTRACT_REQUIRE_GENERATED: '1'
        run: |
          pip install pytest
          pytest python/tests/ -v

      - name: Corpus tests on generated backups (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.engine-deps.outcome == 'success' }}
        env:
          PYTHONUTF8: '1'
          OPENEXTRACT_REQUIRE_GENERATED: '1'
        run: pytest python/tests/corpus -m corpus -v

      # Screenshots and PDFs of the fictional maren and einstein backups only.
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ runner.os }}
          path: e2e-out
          retention-days: 7
          if-no-files-found: ignore
