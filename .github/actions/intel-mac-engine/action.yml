name: Intel Mac engine
description: >
  Builds the engine for Intel Macs into python/dist/x64 on an Apple Silicon runner, with a
  Python run as x86_64 under Rosetta. PyInstaller builds for the chip the Python runs as,
  thinning universal2 libraries to it, and pip picks x86_64 (or universal2) wheels. Run it
  after ios-backup-core is cloned next to the checkout. It leaves PATH alone, so the job's
  own (arm64) Python stays the one every other step uses.

runs:
  using: composite
  steps:
    - name: Setup Python (x64)
      id: python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        architecture: x64
        update-environment: false

    # setup-python's macOS "x64" Python is the same universal2 python.org install as its arm64
    # one (/Library/Frameworks/Python.framework), so the two share site-packages: pip would
    # find the job's arm64 wheels already there and skip installing x86_64 ones. A venv gets
    # its own. And a universal2 Python runs as arm64 on Apple Silicon unless it's started with
    # `arch -x86_64`, so the wrapper does that; the processes it starts (pip, PyInstaller's
    # helpers) stay x86_64 too.
    - name: Make an x86_64 venv for the Intel engine
      shell: bash
      env:
        PY: ${{ steps.python.outputs.python-path }}
      run: |
        VENV="$RUNNER_TEMP/venv-x64"
        arch -x86_64 "$PY" -m venv "$VENV"
        WRAPPER="$RUNNER_TEMP/python-x64"
        printf '#!/bin/sh\nexec arch -x86_64 "%s" "$@"\n' "$VENV/bin/python" > "$WRAPPER"
        chmod +x "$WRAPPER"
        echo "INTEL_PYTHON=$WRAPPER" >> "$GITHUB_ENV"

    - name: Install the engine's dependencies and PyInstaller (x64)
      shell: bash
      working-directory: python
      run: |
        read -r machine venv prefix < <("$INTEL_PYTHON" -c 'import platform, sys; print(platform.machine(), sys.prefix != sys.base_prefix, sys.prefix)')
        echo "The Intel engine's Python runs as $machine from $prefix"
        if [ "$machine" != x86_64 ] || [ "$venv" != True ]; then
          echo "::error::Expected an x86_64 Python in its own venv for the Intel engine, got $machine from $prefix"
          exit 1
        fi
        # constraints-intel-mac.txt holds back what has stopped publishing x86_64 Mac wheels.
        "$INTEL_PYTHON" -m pip install -c constraints-intel-mac.txt pyinstaller -r requirements.txt

    - name: Build the engine (x64)
      shell: bash
      run: node scripts/bundle-engine.mjs --python "$INTEL_PYTHON"
